[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swapstack"
version = "0.1.0"
description = "Swap My Stack: find wasted Shopify app spend, see cheaper replacements, and switch with guided migrations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
swapstack = "swapstack.cli:main"

[tool.setuptools]
packages = ["swapstack"]

[tool.setuptools.package-data]
swapstack = ["data/*.json", "data/playbooks/*.json"]
